<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Belge Oluştur — MiniBilge Öğretmen</title>
  <link rel="stylesheet" href="../assets/css/platform.css">
<link rel="stylesheet" href="../assets/css/belgeler.css">
  <link rel="stylesheet" href="../assets/css/ds.css">
</head>
<body>
  <div class="platform belge-platform no-print" style="max-width:1200px;">
    <a href="index.html" class="back-link">← Belge Merkezi</a>

    <header class="belge-hero" style="padding-bottom:8px;">
      <h2 id="pageTitle">Belge Oluştur</h2>
      <p id="pageDesc">Bilgileri doldurun, önizleyin ve yazdırın veya PDF olarak indirin.</p>
    </header>

    <div class="creator-layout">
      <div class="panel form-panel">
        <div class="panel-title">Belge Bilgileri</div>
        <form id="docForm"></form>
        <button class="btn btn-print" type="button" id="btnPrint" style="margin-top:8px;">🖨️ Yazdır / PDF İndir</button>
        <button class="btn btn-secondary" type="button" id="btnSaveProfile">💾 Bilgileri Kaydet</button>
      </div>

      <div class="preview-panel">
        <div class="preview-toolbar no-print">
          <button class="btn btn-print" type="button" id="btnPrint2">🖨️ Yazdır</button>
          <button class="btn btn-download" type="button" id="btnDownload">⬇️ HTML İndir</button>
        </div>
        <div class="preview-frame">
          <div class="preview-content" id="previewContent"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/js/core/storage.js"></script>
  <script src="../assets/js/documents.js"></script>
  <script>
  (function () {
    'use strict';

    const params = new URLSearchParams(window.location.search);
    const docId = params.get('id');
    const doc = BelgeMerkezi.getDocument(docId);

    if (!doc) {
      document.body.innerHTML = '<div class="platform"><p>Belge bulunamadı.</p><a href="index.html" class="back-link">← Belge Merkezi</a></div>';
      return;
    }

    document.title = `${doc.title} — Belge Oluştur`;
    document.getElementById('pageTitle').textContent = `${doc.icon} ${doc.title}`;
    document.getElementById('pageDesc').textContent = doc.desc;

    const profile = BelgeMerkezi.loadSavedProfile();
    const defaults = BelgeMerkezi.getDefaultValues(doc);
    const formData = { ...defaults, ...profile };

    const form = document.getElementById('docForm');
    const preview = document.getElementById('previewContent');

    function buildForm() {
      form.innerHTML = doc.fields.map(f => {
        const val = formData[f.id] ?? '';
        if (f.type === 'textarea') {
          return `<div class="form-group"><label for="${f.id}">${f.label}</label>
            <textarea id="${f.id}" name="${f.id}">${esc(val)}</textarea></div>`;
        }
        const attrs = [
          f.min != null ? `min="${f.min}"` : '',
          f.max != null ? `max="${f.max}"` : ''
        ].join(' ');
        return `<div class="form-group"><label for="${f.id}">${f.label}</label>
          <input type="${f.type}" id="${f.id}" name="${f.id}" value="${esc(val)}" ${attrs}></div>`;
      }).join('');

      form.querySelectorAll('input, textarea').forEach(el => {
        el.addEventListener('input', updatePreview);
      });
    }

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
    }

    function getFormData() {
      const data = {};
      doc.fields.forEach(f => {
        const el = document.getElementById(f.id);
        data[f.id] = el ? el.value : '';
      });
      return data;
    }

    function updatePreview() {
      preview.innerHTML = BelgeMerkezi.renderDocument(docId, getFormData());
    }

    function printDoc() {
      const printWindow = window.open('', '_blank');
      printWindow.document.write(`<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8">
        <title>${doc.title}</title>
        <style>
          body { font-family: 'Times New Roman', Times, serif; font-size: 12pt; margin: 20mm; color: #1a1a1a; }
          .doc-letterhead { margin-bottom: 24px; border-bottom: 2px solid #1a1a1a; padding-bottom: 16px; }
          .letterhead-top { display: flex; justify-content: space-between; }
          .school-name { font-size: 14pt; font-weight: 700; text-transform: uppercase; }
          .school-sub { font-size: 10pt; color: #555; }
          .letterhead-right { text-align: right; font-size: 10pt; }
          .doc-title { text-align: center; font-size: 16pt; font-weight: 700; margin-top: 16px; text-transform: uppercase; }
          .doc-meta, .doc-intro, .doc-body { margin-bottom: 8px; }
          .doc-footer { margin-top: 24px; font-size: 10pt; color: #555; border-top: 1px solid #ccc; padding-top: 8px; }
          .doc-note { font-size: 9pt; color: #666; font-style: italic; }
          .doc-sub { font-size: 11pt; font-weight: 700; margin: 16px 0 8px; }
          table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 10pt; }
          th, td { border: 1px solid #333; padding: 6px 8px; }
          th { background: #f0f0f0; }
          .compact th, .compact td { padding: 4px 5px; font-size: 8pt; }
          .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
          .form-field.full { grid-column: 1 / -1; }
          .form-field label { font-size: 9pt; font-weight: 700; }
          .line { border-bottom: 1px solid #333; min-height: 24px; margin-top: 4px; }
          .line.tall { min-height: 48px; }
          .rules-list { margin-left: 24px; }
          .sign-row, .sign-grid { display: flex; justify-content: space-between; margin-top: 32px; font-size: 10pt; }
          .sign-grid { display: grid; grid-template-columns: repeat(3,1fr); text-align: center; }
          .sign-line { border-bottom: 1px solid #333; margin: 32px 0 8px; }
          .info-box { border: 1px solid #333; padding: 12px; margin: 16px 0; }
          .exam-info { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 16px; padding: 8px; background: #f5f5f5; border: 1px solid #ccc; font-size: 10pt; }
          .student-info-row { display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 10pt; }
          .question-block { margin-bottom: 20px; page-break-inside: avoid; }
          .answer-area { border: 1px solid #ccc; min-height: 80px; margin-top: 8px; }
          @media print { body { margin: 15mm; } }
        </style></head><body>${preview.innerHTML}</body></html>`);
      printWindow.document.close();
      printWindow.focus();
      setTimeout(() => { printWindow.print(); }, 300);
    }

    function downloadHtml() {
      const html = `<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><title>${doc.title}</title>
        <style>body{font-family:'Times New Roman',serif;font-size:12pt;margin:20mm;color:#1a1a1a}
        table{width:100%;border-collapse:collapse}th,td{border:1px solid #333;padding:6px 8px}
        th{background:#f0f0f0}.doc-title{text-align:center;font-size:16pt;font-weight:700}
        .line{border-bottom:1px solid #333;min-height:24px}</style></head>
        <body>${preview.innerHTML}</body></html>`;
      const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${doc.id}-${new Date().toISOString().slice(0,10)}.html`;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    document.getElementById('btnPrint').addEventListener('click', printDoc);
    document.getElementById('btnPrint2').addEventListener('click', printDoc);
    document.getElementById('btnDownload').addEventListener('click', downloadHtml);

    document.getElementById('btnSaveProfile').addEventListener('click', () => {
      const data = getFormData();
      const profileFields = ['okulAdi', 'ogretmenAdi', 'sinif', 'egitimYili'];
      const profile = {};
      profileFields.forEach(k => { if (data[k]) profile[k] = data[k]; });
      BelgeMerkezi.saveProfile(profile);
      if (window.MiniBilgeStorage) {
        MiniBilgeStorage.addDocument({ title: doc.title, type: doc.id });
      }
      alert('Okul ve öğretmen bilgileri kaydedildi.');
    });

    buildForm();
    updatePreview();
  })();
  </script>
</body>
</html>
