<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ABC Bağlamaca</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg1: #667eea;
      --bg2: #764ba2;
      --bg3: #f093fb;
      --glass: rgba(255, 255, 255, 0.18);
      --glass-border: rgba(255, 255, 255, 0.35);
      --glass-strong: rgba(255, 255, 255, 0.28);
      --text: #ffffff;
      --text-soft: rgba(255, 255, 255, 0.85);
      --shadow: 0 8px 32px rgba(31, 38, 135, 0.25);
      --radius: 18px;
      --cell-size: clamp(52px, 14vw, 72px);
      --color-a: #ff6b6b;
      --color-b: #4ecdc4;
      --color-c: #ffe66d;
      --color-d: #a78bfa;
    }

    html { font-size: 16px; }

    body {
      font-family: 'Segoe UI', 'Nunito', system-ui, sans-serif;
      min-height: 100dvh;
      background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 50%, var(--bg3) 100%);
      background-attachment: fixed;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.15) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(255,255,255,0.1) 0%, transparent 40%);
      pointer-events: none;
      z-index: 0;
    }

    .app {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Header */
    .header {
      text-align: center;
      padding: 20px 16px 8px;
    }

    .header h1 {
      font-size: clamp(1.8rem, 6vw, 2.4rem);
      font-weight: 800;
      letter-spacing: 0.02em;
      text-shadow: 0 2px 12px rgba(0,0,0,0.2);
      margin-bottom: 4px;
    }

    .header .subtitle {
      font-size: 0.95rem;
      color: var(--text-soft);
      font-weight: 500;
    }

    /* Glass panels */
    .panel {
      background: var(--glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
    }

    /* Level selector */
    .level-bar {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .level-bar label {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-soft);
      text-align: center;
    }

    .level-buttons {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .level-btn {
      flex: 1;
      min-width: 56px;
      max-width: 80px;
      padding: 10px 6px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 14px;
      background: rgba(255,255,255,0.12);
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      line-height: 1.2;
    }

    .level-btn:hover {
      background: rgba(255,255,255,0.22);
      transform: translateY(-2px);
    }

    .level-btn.active {
      background: rgba(255,255,255,0.38);
      border-color: #fff;
      box-shadow: 0 4px 16px rgba(255,255,255,0.25);
      transform: scale(1.05);
    }

    .level-btn .grade {
      display: block;
      font-size: 0.65rem;
      font-weight: 500;
      opacity: 0.8;
      margin-top: 2px;
    }

    .level-info {
      text-align: center;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-soft);
      padding: 4px 0;
    }

    .level-info strong {
      color: #fff;
    }

    /* Grid */
    .grid-wrap {
      display: flex;
      justify-content: center;
      padding: 8px 0;
    }

    .grid {
      display: grid;
      gap: 6px;
      padding: 12px;
      background: var(--glass-strong);
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      touch-action: none;
    }

    .cell {
      width: var(--cell-size);
      height: var(--cell-size);
      border-radius: 12px;
      background: rgba(255,255,255,0.15);
      border: 2px solid rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.3rem, 4vw, 1.7rem);
      font-weight: 800;
      cursor: pointer;
      position: relative;
      transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
    }

    .cell:hover:not(.endpoint) {
      background: rgba(255,255,255,0.22);
    }

    .cell.endpoint {
      box-shadow: inset 0 0 0 3px rgba(255,255,255,0.5);
      font-size: clamp(1.5rem, 5vw, 2rem);
    }

    .cell.path-a { background: color-mix(in srgb, var(--color-a) 70%, white 30%); border-color: var(--color-a); }
    .cell.path-b { background: color-mix(in srgb, var(--color-b) 70%, white 30%); border-color: var(--color-b); }
    .cell.path-c { background: color-mix(in srgb, var(--color-c) 70%, white 30%); border-color: var(--color-c); color: #5a4a00; }
    .cell.path-d { background: color-mix(in srgb, var(--color-d) 70%, white 30%); border-color: var(--color-d); }

    .cell.endpoint.color-a { background: var(--color-a); color: #fff; }
    .cell.endpoint.color-b { background: var(--color-b); color: #fff; }
    .cell.endpoint.color-c { background: var(--color-c); color: #5a4a00; }
    .cell.endpoint.color-d { background: var(--color-d); color: #fff; }

    .cell.path-a:not(.endpoint) { color: rgba(255,255,255,0.7); font-size: 0.9rem; }
    .cell.path-b:not(.endpoint) { color: rgba(255,255,255,0.7); font-size: 0.9rem; }
    .cell.path-c:not(.endpoint) { color: rgba(90,74,0,0.6); font-size: 0.9rem; }
    .cell.path-d:not(.endpoint) { color: rgba(255,255,255,0.7); font-size: 0.9rem; }

    /* Path connectors */
    .cell::after {
      content: '';
      position: absolute;
      pointer-events: none;
      z-index: 0;
    }

    .cell.conn-top::before {
      content: '';
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 8px;
      height: 8px;
      background: inherit;
      z-index: -1;
    }

    /* Action buttons */
    .actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 14px 12px;
      border: none;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-restart {
      background: rgba(255,255,255,0.2);
      color: #fff;
      border: 2px solid rgba(255,255,255,0.35);
    }

    .btn-restart:hover {
      background: rgba(255,255,255,0.32);
      transform: translateY(-2px);
    }

    .btn-check {
      background: linear-gradient(135deg, #00c9ff, #92fe9d);
      color: #1a3a2a;
      box-shadow: 0 4px 16px rgba(0,201,255,0.35);
    }

    .btn-check:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,201,255,0.45);
    }

    /* Message toast */
    .toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: rgba(255,255,255,0.95);
      color: #333;
      padding: 28px 36px;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      max-width: 90vw;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      pointer-events: auto;
    }

    .toast.success {
      background: linear-gradient(135deg, #fff9c4, #fff);
      border: 3px solid #ffd54f;
    }

    .toast.error {
      background: linear-gradient(135deg, #ffebee, #fff);
      border: 3px solid #ef9a9a;
    }

    .toast .icon {
      font-size: 3rem;
      margin-bottom: 8px;
      animation: bounce 0.6s ease infinite alternate;
    }

    .toast h2 {
      font-size: 1.4rem;
      margin-bottom: 6px;
      color: #2e7d32;
    }

    .toast.error h2 { color: #c62828; }

    .toast p {
      font-size: 0.95rem;
      color: #555;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-8px); }
    }

    /* Confetti */
    .confetti-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      overflow: hidden;
    }

    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      top: -10px;
      animation: confetti-fall linear forwards;
    }

    @keyframes confetti-fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }

    /* Instructions */
    .instructions {
      font-size: 0.82rem;
      color: var(--text-soft);
      text-align: center;
      line-height: 1.5;
      padding: 0 8px;
    }

    .instructions span {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      padding: 2px 8px;
      border-radius: 8px;
      margin: 2px;
      font-weight: 600;
    }

    /* Overlay backdrop */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    @media (max-width: 380px) {
      :root { --cell-size: 48px; }
      .level-btn { min-width: 48px; font-size: 0.75rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>🔤 ABC Bağlamaca</h1>
      <p class="subtitle">Harfleri birbirine bağla, tüm kareleri doldur!</p>
    </header>

    <div class="panel level-bar">
      <label>Seviye Seç</label>
      <div class="level-buttons" id="levelButtons"></div>
      <div class="level-info" id="levelInfo"></div>
    </div>

    <div class="grid-wrap">
      <div class="grid" id="grid"></div>
    </div>

    <div class="panel actions">
      <button class="btn btn-restart" id="btnRestart">🔄 Yeniden Başlat</button>
      <button class="btn btn-check" id="btnCheck">✅ Çözümü Kontrol Et</button>
    </div>

    <p class="instructions">
      <span>Aynı harfleri bağla</span>
      <span>Çapraz yasak</span>
      <span>Tüm kareleri doldur</span>
    </p>
  </div>

  <div class="overlay" id="overlay"></div>
  <div class="toast" id="toast">
    <div class="icon" id="toastIcon"></div>
    <h2 id="toastTitle"></h2>
    <p id="toastMsg"></p>
  </div>
  <div class="confetti-container" id="confetti"></div>

  <script>
  (function () {
    'use strict';

    const LETTER_COLORS = { A: 'a', B: 'b', C: 'c', D: 'd' };

    const LEVELS = [
      {
        id: 1,
        name: 'Çok Kolay',
        grade: '1. Sınıf',
        size: 3,
        pairs: ['A', 'B'],
        puzzle: [
          ['A', 'B', 'B'],
          ['', '', ''],
          ['', '', 'A']
        ],
        endpoints: { A: [[0,0],[2,2]], B: [[0,1],[0,2]] }
      },
      {
        id: 2,
        name: 'Kolay',
        grade: '1. Sınıf+',
        size: 4,
        pairs: ['A', 'B'],
        puzzle: [
          ['A', '', '', 'B'],
          ['', '', '', ''],
          ['', '', '', ''],
          ['A', '', '', 'B']
        ],
        endpoints: { A: [[0,0],[3,0]], B: [[0,3],[3,3]] }
      },
      {
        id: 3,
        name: 'Orta',
        grade: '2. Sınıf',
        size: 4,
        pairs: ['A', 'B', 'C'],
        puzzle: [
          ['A', '', '', ''],
          ['', 'B', 'A', ''],
          ['', '', 'B', 'C'],
          ['C', '', '', '']
        ],
        endpoints: { A: [[0,0],[1,2]], B: [[1,1],[2,2]], C: [[2,3],[3,0]] }
      },
      {
        id: 4,
        name: 'Zor',
        grade: '3. Sınıf',
        size: 5,
        pairs: ['A', 'B', 'C'],
        puzzle: [
          ['A', '', '', '', ''],
          ['', 'B', 'A', '', ''],
          ['', '', '', '', ''],
          ['', '', '', 'C', 'B'],
          ['', '', '', '', 'C']
        ],
        endpoints: { A: [[0,0],[1,2]], B: [[1,1],[3,4]], C: [[3,3],[4,4]] }
      },
      {
        id: 5,
        name: 'Uzman',
        grade: '4. Sınıf',
        size: 5,
        pairs: ['A', 'B', 'C', 'D'],
        puzzle: [
          ['A', '', '', '', ''],
          ['', '', 'B', 'A', ''],
          ['', '', '', 'B', 'C'],
          ['', '', '', '', ''],
          ['C', 'D', '', '', 'D']
        ],
        endpoints: { A: [[0,0],[1,3]], B: [[1,2],[2,3]], C: [[2,4],[4,0]], D: [[4,1],[4,4]] }
      }
    ];

    let currentLevel = 0;
    let size = 3;
    let endpoints = {};
    let endpointSet = new Set();
    let paths = {};
    let activeLetter = null;
    let isDrawing = false;
    let lastCell = null;

    const gridEl = document.getElementById('grid');
    const levelButtonsEl = document.getElementById('levelButtons');
    const levelInfoEl = document.getElementById('levelInfo');
    const btnRestart = document.getElementById('btnRestart');
    const btnCheck = document.getElementById('btnCheck');
    const toast = document.getElementById('toast');
    const toastIcon = document.getElementById('toastIcon');
    const toastTitle = document.getElementById('toastTitle');
    const toastMsg = document.getElementById('toastMsg');
    const overlay = document.getElementById('overlay');
    const confettiEl = document.getElementById('confetti');

    /* ── Audio (Web Audio API celebration) ── */
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function getAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
      return audioCtx;
    }

    function playTone(freq, start, dur, type = 'sine', vol = 0.15) {
      try {
        const ctx = getAudio();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(vol, ctx.currentTime + start);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + start);
        osc.stop(ctx.currentTime + start + dur);
      } catch (_) {}
    }

    function playSuccessSound() {
      const notes = [523, 659, 784, 1047];
      notes.forEach((n, i) => playTone(n, i * 0.12, 0.3, 'sine', 0.18));
      setTimeout(() => playTone(1318, 0.5, 0.5, 'triangle', 0.12), 400);
    }

    function playErrorSound() {
      playTone(200, 0, 0.2, 'square', 0.1);
      playTone(150, 0.15, 0.3, 'square', 0.08);
    }

    function playClickSound() {
      playTone(440, 0, 0.08, 'sine', 0.06);
    }

    /* ── Helpers ── */
    function key(r, c) { return r + ',' + c; }

    function parseKey(k) {
      const [r, c] = k.split(',').map(Number);
      return [r, c];
    }

    function isAdjacent(r1, c1, r2, c2) {
      return (Math.abs(r1 - r2) + Math.abs(c1 - c2)) === 1;
    }

    function isEndpoint(r, c) {
      return endpointSet.has(key(r, c));
    }

    function getEndpointLetter(r, c) {
      for (const [letter, coords] of Object.entries(endpoints)) {
        for (const [er, ec] of coords) {
          if (er === r && ec === c) return letter;
        }
      }
      return null;
    }

    function getCellOwner(r, c) {
      if (isEndpoint(r, c)) return getEndpointLetter(r, c);
      for (const [letter, path] of Object.entries(paths)) {
        for (const [pr, pc] of path) {
          if (pr === r && pc === c) return letter;
        }
      }
      return null;
    }

    function clearLetterPath(letter) {
      paths[letter] = [];
    }

    function rebuildPathsFromEndpoints() {
      const level = LEVELS[currentLevel];
      paths = {};
      level.pairs.forEach(l => { paths[l] = []; });
    }

    /* ── Level setup ── */
    function buildLevelButtons() {
      levelButtonsEl.innerHTML = '';
      LEVELS.forEach((lvl, idx) => {
        const btn = document.createElement('button');
        btn.className = 'level-btn' + (idx === currentLevel ? ' active' : '');
        btn.innerHTML = `Level ${lvl.id}<span class="grade">${lvl.grade}</span>`;
        btn.addEventListener('click', () => {
          if (idx !== currentLevel) {
            playClickSound();
            currentLevel = idx;
            loadLevel();
            buildLevelButtons();
          }
        });
        levelButtonsEl.appendChild(btn);
      });
    }

    function loadLevel() {
      const level = LEVELS[currentLevel];
      size = level.size;
      endpoints = level.endpoints;
      endpointSet = new Set();
      Object.values(endpoints).flat().forEach(([r, c]) => endpointSet.add(key(r, c)));
      rebuildPathsFromEndpoints();
      activeLetter = null;
      isDrawing = false;
      lastCell = null;

      levelInfoEl.innerHTML =
        `<strong>Level ${level.id} – ${level.name}</strong> · ${size}×${size} ızgara · ${level.pairs.length} harf çifti (${level.pairs.join(', ')})`;

      renderGrid();
    }

    /* ── Render ── */
    function renderGrid() {
      gridEl.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
      gridEl.innerHTML = '';

      const level = LEVELS[currentLevel];

      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.dataset.r = r;
          cell.dataset.c = c;

          const epLetter = getEndpointLetter(r, c);
          const owner = getCellOwner(r, c);

          if (epLetter) {
            cell.classList.add('endpoint', 'color-' + LETTER_COLORS[epLetter]);
            cell.textContent = epLetter;
          } else if (owner) {
            cell.classList.add('path-' + LETTER_COLORS[owner]);
            cell.textContent = owner;
          }

          gridEl.appendChild(cell);
        }
      }
    }

    function getCellFromEvent(e) {
      const target = e.target.closest('.cell');
      if (!target) return null;
      return [parseInt(target.dataset.r, 10), parseInt(target.dataset.c, 10)];
    }

    /* ── Drawing / Rule Engine ── */
    function startDraw(r, c) {
      const epLetter = getEndpointLetter(r, c);
      if (!epLetter) return;

      playClickSound();
      activeLetter = epLetter;
      isDrawing = true;
      lastCell = [r, c];

      const path = paths[activeLetter];
      const idx = path.findIndex(([pr, pc]) => pr === r && pc === c);

      if (idx !== -1) {
        paths[activeLetter] = path.slice(0, idx + 1);
      } else {
        clearOtherPathsFromCell(r, c, activeLetter);
        paths[activeLetter] = [[r, c]];
      }

      renderGrid();
    }

    function clearOtherPathsFromCell(r, c, exceptLetter) {
      for (const letter of Object.keys(paths)) {
        if (letter === exceptLetter) continue;
        paths[letter] = paths[letter].filter(([pr, pc]) => pr !== r || pc !== c);
      }
    }

    function continueDraw(r, c) {
      if (!isDrawing || !activeLetter) return;
      if (lastCell && lastCell[0] === r && lastCell[1] === c) return;

      if (!isAdjacent(lastCell[0], lastCell[1], r, c)) return;

      const path = paths[activeLetter];
      const existingIdx = path.findIndex(([pr, pc]) => pr === r && pc === c);

      /* Backtracking: returning on own path shortens it */
      if (existingIdx !== -1) {
        paths[activeLetter] = path.slice(0, existingIdx + 1);
        lastCell = [r, c];
        renderGrid();
        return;
      }

      /* Cannot enter other letter endpoints */
      const epLetter = getEndpointLetter(r, c);
      if (epLetter && epLetter !== activeLetter) return;

      /* Cannot cross other paths */
      const owner = getCellOwner(r, c);
      if (owner && owner !== activeLetter) return;

      /* Clear this cell from other paths */
      clearOtherPathsFromCell(r, c, activeLetter);

      paths[activeLetter].push([r, c]);
      lastCell = [r, c];
      renderGrid();

      /* Auto-complete when reaching matching endpoint */
      if (epLetter === activeLetter) {
        const ep = endpoints[activeLetter];
        const pathStart = path[0];
        const isAtOtherEnd = ep.some(([er, ec]) => er === r && ec === c) &&
          !(pathStart[0] === r && pathStart[1] === c);
        if (isAtOtherEnd) {
          isDrawing = false;
        }
      }
    }

    function endDraw() {
      isDrawing = false;
      activeLetter = null;
      lastCell = null;
    }

    /* ── Pointer events ── */
    gridEl.addEventListener('mousedown', (e) => {
      e.preventDefault();
      const pos = getCellFromEvent(e);
      if (pos) startDraw(pos[0], pos[1]);
    });

    gridEl.addEventListener('mousemove', (e) => {
      if (!isDrawing) return;
      e.preventDefault();
      const pos = getCellFromEvent(e);
      if (pos) continueDraw(pos[0], pos[1]);
    });

    document.addEventListener('mouseup', endDraw);

    gridEl.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      const target = document.elementFromPoint(touch.clientX, touch.clientY);
      if (!target) return;
      const cell = target.closest('.cell');
      if (!cell) return;
      const r = parseInt(cell.dataset.r, 10);
      const c = parseInt(cell.dataset.c, 10);
      startDraw(r, c);
    }, { passive: false });

    gridEl.addEventListener('touchmove', (e) => {
      if (!isDrawing) return;
      e.preventDefault();
      const touch = e.touches[0];
      const target = document.elementFromPoint(touch.clientX, touch.clientY);
      if (!target) return;
      const cell = target.closest('.cell');
      if (!cell) return;
      const r = parseInt(cell.dataset.r, 10);
      const c = parseInt(cell.dataset.c, 10);
      continueDraw(r, c);
    }, { passive: false });

    gridEl.addEventListener('touchend', (e) => {
      e.preventDefault();
      endDraw();
    });

    /* ── Solution validation ── */
    function validateSolution() {
      const level = LEVELS[currentLevel];
      const issues = [];

      for (const letter of level.pairs) {
        const eps = endpoints[letter];
        const path = paths[letter];

        if (path.length < 2) {
          issues.push(`${letter} harfi henüz bağlanmadı.`);
          continue;
        }

        const pathSet = new Set(path.map(([r,c]) => key(r,c)));
        const hasEp1 = pathSet.has(key(eps[0][0], eps[0][1]));
        const hasEp2 = pathSet.has(key(eps[1][0], eps[1][1]));
        if (!hasEp1 || !hasEp2) {
          issues.push(`${letter} harfinin iki ucu birbirine bağlı değil.`);
          continue;
        }

        for (let i = 1; i < path.length; i++) {
          if (!isAdjacent(path[i-1][0], path[i-1][1], path[i][0], path[i][1])) {
            issues.push(`${letter} yolunda kopukluk var.`);
            break;
          }
        }
      }

      const occupied = new Map();
      for (const letter of level.pairs) {
        for (const [r, c] of paths[letter]) {
          const k = key(r, c);
          if (occupied.has(k) && occupied.get(k) !== letter) {
            issues.push('Yollar birbirine çakışıyor!');
            break;
          }
          occupied.set(k, letter);
        }
      }

      let emptyCount = 0;
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          if (!occupied.has(key(r, c))) emptyCount++;
        }
      }

      if (emptyCount > 0) {
        issues.push(`Henüz ${emptyCount} boş kare var. Tüm ızgarayı doldur!`);
      }

      return { valid: issues.length === 0, issues };
    }

    /* ── UI feedback ── */
    function showToast(type, icon, title, msg, duration = 3000) {
      toast.className = 'toast show ' + type;
      toastIcon.textContent = icon;
      toastTitle.textContent = title;
      toastMsg.textContent = msg;
      overlay.classList.add('show');

      setTimeout(() => {
        toast.classList.remove('show');
        overlay.classList.remove('show');
      }, duration);
    }

    function spawnConfetti() {
      confettiEl.innerHTML = '';
      const colors = ['#ff6b6b','#4ecdc4','#ffe66d','#a78bfa','#ff9ff3','#54a0ff','#5cd85a'];
      for (let i = 0; i < 60; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti';
        piece.style.left = Math.random() * 100 + '%';
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDuration = (2 + Math.random() * 2) + 's';
        piece.style.animationDelay = Math.random() * 0.5 + 's';
        piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        piece.style.width = (6 + Math.random() * 8) + 'px';
        piece.style.height = (6 + Math.random() * 8) + 'px';
        confettiEl.appendChild(piece);
      }
      setTimeout(() => { confettiEl.innerHTML = ''; }, 4500);
    }

    /* ── Button handlers ── */
    btnRestart.addEventListener('click', () => {
      playClickSound();
      rebuildPathsFromEndpoints();
      renderGrid();
    });

    btnCheck.addEventListener('click', () => {
      const result = validateSolution();
      if (result.valid) {
        playSuccessSound();
        spawnConfetti();
        const lvl = LEVELS[currentLevel];
        showToast('success', '🎉', 'Tebrikler!', `Level ${lvl.id} (${lvl.name}) başarıyla tamamlandı! Harika iş çıkardın!`, 4000);
      } else {
        playErrorSound();
        showToast('error', '🤔', 'Henüz Tamamlanmadı', result.issues[0], 2500);
      }
    });

    overlay.addEventListener('click', () => {
      toast.classList.remove('show');
      overlay.classList.remove('show');
    });

    /* ── Init ── */
    buildLevelButtons();
    loadLevel();
  })();
  </script>
</body>
</html>
