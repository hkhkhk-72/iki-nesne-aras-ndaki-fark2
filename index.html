  <style>
    .boot-shell {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      position: relative;
      z-index: 1;
    }
    .boot-shell strong {
      display: block;
      font-family: "Fraunces", Georgia, serif;
      font-size: 1.5rem;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="boot-shell">
      <div>
        <strong>MiniBilge Öğretmen</strong>
        <span>Ana sayfa yükleniyor…</span>
      </div>
    </div>
  </div>

  <script>
    (function () {
      if (location.protocol === 'file:') {
        window.MINIBILGE_BASE = '';
        return;
      }
      if (/\.github\.io$/i.test(location.hostname)) {
        var seg = location.pathname.split('/').filter(Boolean)[0] || '';
        window.MINIBILGE_BASE = seg ? '/' + seg + '/' : '/';
        return;
      }
      var path = location.pathname || '/';
      if (/\/[^/]+\.html$/i.test(path)) path = path.replace(/\/[^/]+\.html$/i, '/');
      if (!path.endsWith('/')) path += '/';
      window.MINIBILGE_BASE = (path === '/') ? '' : path;
    })();
  </script>
