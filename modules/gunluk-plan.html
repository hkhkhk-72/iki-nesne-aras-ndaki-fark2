<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Günlük Plan — MiniBilge Öğretmen</title>
  <link rel="stylesheet" href="../assets/css/platform.css">
<link rel="stylesheet" href="../assets/css/belgeler.css">
  <link rel="stylesheet" href="../assets/css/ds.css">
</head>
<body>
  <div id="app"></div>

  <script>window.MINIBILGE_BASE = '../';</script>
  <script src="../assets/js/core/storage.js"></script>
  <script src="../assets/js/core/calendar-engine.js"></script>
  <script src="../assets/js/core/daily-plan-engine.js"></script>
  <script src="../assets/js/core/validation-engine.js"></script>
  <script src="../assets/js/core/plan-engine.js"></script>
  <script src="../assets/js/core/evrak-engine.js"></script>
  <script src="../assets/js/core/wizard.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script>
  (async function () {
    const plans = MiniBilgeStorage.getPlans().filter(p => p.tur === 'yillik' && p.data);
    const cal = await CalendarEngine.loadCalendar();
    const week = CalendarEngine.getCurrentWeek(cal);
    const gunler = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
    let step = plans.length ? 2 : 1;
    let currentPlan = null;
    const state = { planIdx: 0, hafta: week?.hafta || 1, gun: gunler[new Date().getDay()] || 'Pazartesi', dersSaati: 1, tarih: new Date().toISOString().slice(0, 10) };

    function render() {
      document.getElementById('app').innerHTML = MiniBilgeNav.renderLayout('gunluk-plan', `
        <div class="module-page">
          <h1>📖 Plan Motoru — Günlük Plan</h1>
          <p class="lead">Yıllık plandan öğrenme çıktılarını okuyarak günlük ders planı üretir.</p>
          ${UretimWizard.render(step)}
          <div id="alerts"></div>
          <div class="panel" style="background:var(--glass);padding:20px;border-radius:var(--radius);">
            ${step === 1 ? step1() : ''}
            ${step === 2 ? step2() : ''}
            ${step === 3 ? step3() : ''}
            ${step === 4 ? step4() : ''}
          </div>
          <div class="quick-actions no-print" style="margin-top:12px;">
            ${step > 1 ? '<button class="quick-btn" id="btnPrev" type="button">← Geri</button>' : ''}
            ${step < 4 ? '<button class="quick-btn primary" id="btnNext" type="button">İleri →</button>' : ''}
          </div>
          <div class="preview-panel" id="previewPanel" style="display:none;margin-top:16px;">
            <div class="preview-frame"><div class="preview-content" id="preview"></div></div>
          </div>
        </div>`);
      bindEvents();
    }

    function step1() {
      if (!plans.length) return `<div class="alert alert-warn">Önce <a href="yillik-plan.html" style="text-decoration:underline">yıllık plan</a> oluşturun.</div>`;
      return `<div class="form-field"><label>Yıllık Plan Seçin</label>
        <select id="annualPlan">${plans.map((p, i) =>
          `<option value="${i}">${p.ders} — ${p.sinif}. Sınıf (${p.data?.egitimYili || ''})</option>`).join('')}
        </select></div>`;
    }

    function step2() {
      return `<div class="form-row">
        <div class="form-field"><label>Hafta</label><input type="number" id="hafta" value="${state.hafta}" min="1" max="40"></div>
        <div class="form-field"><label>Gün</label>
          <select id="gun">${gunler.slice(1,6).map(g =>
            `<option value="${g}" ${state.gun === g ? 'selected' : ''}>${g}</option>`).join('')}
          </select></div>
        <div class="form-field"><label>Ders Saati</label><input type="number" id="dersSaati" value="${state.dersSaati}" min="1" max="10"></div>
        <div class="form-field"><label>Tarih</label><input type="date" id="tarih" value="${state.tarih}"></div>
      </div>`;
    }

    function step3() {
      const p = plans[state.planIdx]?.data;
      const row = p?.satirlar?.find(r => r.hafta === state.hafta) || p?.satirlar?.[0];
      return `<p><strong>Önizleme:</strong> Hafta ${state.hafta} · ${row?.tema || '—'}</p>
        <p class="empty-state" style="text-align:left;font-size:0.85rem;">${row?.ogrenmeCiktilari?.slice(0, 120) || ''}...</p>`;
    }

    function step4() {
      return `<button class="quick-btn primary" id="btnGenerate" type="button">⚡ Günlük Planı Üret</button>
        <div class="quick-actions" style="margin-top:12px;">
          <button class="quick-btn" id="btnPrint" type="button" disabled>🖨️ PDF</button>
          <button class="quick-btn" id="btnWord" type="button" disabled>📄 Word</button>
        </div>`;
    }

    function bindEvents() {
      document.getElementById('btnNext')?.addEventListener('click', () => {
        if (step === 1) state.planIdx = parseInt(document.getElementById('annualPlan')?.value || '0', 10);
        if (step === 2) {
          state.hafta = parseInt(document.getElementById('hafta')?.value || state.hafta, 10);
          state.gun = document.getElementById('gun')?.value || state.gun;
          state.dersSaati = document.getElementById('dersSaati')?.value || state.dersSaati;
          state.tarih = document.getElementById('tarih')?.value || state.tarih;
        }
        if (step < 4) { step++; render(); }
      });
      document.getElementById('btnPrev')?.addEventListener('click', () => { if (step > 1) { step--; render(); } });

      document.getElementById('btnGenerate')?.addEventListener('click', () => {
        const annual = plans[state.planIdx]?.data;
        const result = PlanEngine.uretGunlukPlan({ annualPlan: annual, ...state });
        const alerts = document.getElementById('alerts');
        if (!result.success) {
          alerts.innerHTML = result.errors.map(e => `<div class="alert alert-error">${e}</div>`).join('');
          return;
        }
        currentPlan = result.plan;
        document.getElementById('preview').innerHTML = PlanEngine.renderGunlukPlan(currentPlan);
        document.getElementById('previewPanel').style.display = 'block';
        document.getElementById('btnPrint').disabled = false;
        document.getElementById('btnWord').disabled = false;
        MiniBilgeStorage.addPlan({ tur: 'gunluk', ders: currentPlan.ders, sinif: currentPlan.sinif, hafta: currentPlan.hafta });
        alerts.innerHTML = '<div class="alert alert-ok">✅ Günlük plan üretildi.</div>';
      });

      document.getElementById('btnPrint')?.addEventListener('click', () => {
        EvrakEngine.yazdir(PlanEngine.renderGunlukPlan(currentPlan), 'Günlük Plan');
      });
      document.getElementById('btnWord')?.addEventListener('click', () => {
        EvrakEngine.indirWord(PlanEngine.renderGunlukPlan(currentPlan), 'gunluk-plan', 'Günlük Plan');
      });
    }

    render();
  })();
  </script>
</body>
</html>
