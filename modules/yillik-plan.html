<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yıllık Plan — MiniBilge Öğretmen</title>
  <link rel="stylesheet" href="../assets/css/platform.css">
  <link rel="stylesheet" href="../assets/css/belgeler.css">
</head>
<body>
  <div id="app"></div>

  <script>window.MINIBILGE_BASE = '../';</script>
  <script src="../assets/js/core/storage.js"></script>
  <script src="../assets/js/core/calendar-engine.js"></script>
  <script src="../assets/js/core/curriculum-engine.js"></script>
  <script src="../assets/js/core/annual-plan-engine.js"></script>
  <script src="../assets/js/core/validation-engine.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script>
  (async function () {
    const profile = MiniBilgeStorage.getProfile();
    const school = MiniBilgeStorage.getSchool();
    const settings = MiniBilgeStorage.getSettings();
    const courses = CurriculumEngine.listAvailableCourses(settings.varsayilanSinif || '1');

    const content = `
      <div class="module-page">
        <h1>📆 Yıllık Plan Motoru</h1>
        <p class="lead">Türkiye Yüzyılı Maarif Modeli, MEB çalışma takvimi ve öğretim programı verilerini birleştirerek otomatik yıllık plan oluşturur. Hazır plan kopyalanmaz.</p>

        <div id="alerts"></div>

        <div class="panel" style="background:var(--glass);padding:20px;border-radius:var(--radius);margin-bottom:16px;">
          <div class="form-row">
            <div class="form-field">
              <label>Sınıf</label>
              <select id="sinif">
                <option value="1" ${settings.varsayilanSinif === '1' ? 'selected' : ''}>1. Sınıf</option>
                <option value="2" disabled>2. Sınıf (yakında)</option>
                <option value="3" disabled>3. Sınıf (yakında)</option>
                <option value="4" disabled>4. Sınıf (yakında)</option>
              </select>
            </div>
            <div class="form-field">
              <label>Ders</label>
              <select id="ders">
                ${courses.map(c => `<option value="${c.id}">${c.ad}</option>`).join('')}
              </select>
            </div>
            <div class="form-field">
              <label>Eğitim-Öğretim Yılı</label>
              <input type="text" id="egitimYili" value="${school.egitimYili || '2025-2026'}">
            </div>
          </div>
          <div class="quick-actions">
            <button class="quick-btn primary" id="btnGenerate" type="button">⚡ Planı Oluştur</button>
            <button class="quick-btn" id="btnPrint" type="button" disabled>🖨️ Yazdır / PDF</button>
            <button class="quick-btn" id="btnDownload" type="button" disabled>⬇️ HTML İndir</button>
          </div>
        </div>

        <div class="preview-panel" id="previewPanel" style="display:none;">
          <div class="preview-frame">
            <div class="preview-content" id="preview"></div>
          </div>
        </div>
      </div>`;

    document.getElementById('app').innerHTML = MiniBilgeNav.renderLayout('yillik-plan', content);

    let currentPlan = null;

    document.getElementById('btnGenerate').addEventListener('click', async () => {
      const alerts = document.getElementById('alerts');
      alerts.innerHTML = '';

      const ctx = {
        sinif: document.getElementById('sinif').value,
        dersId: document.getElementById('ders').value,
        okul: { ...school, egitimYili: document.getElementById('egitimYili').value },
        ogretmen: profile
      };

      const validation = ValidationEngine.validatePlanContext(ctx);
      if (!validation.valid) {
        alerts.innerHTML = validation.errors.map(e => `<div class="alert alert-error">${e}</div>`).join('');
        return;
      }
      if (validation.warnings.length) {
        alerts.innerHTML += validation.warnings.map(w => `<div class="alert alert-warn">${w}</div>`).join('');
      }

      try {
        currentPlan = await AnnualPlanEngine.generateAnnualPlan(ctx);
        const planCheck = ValidationEngine.validateAnnualPlan(currentPlan);
        if (!planCheck.valid) {
          alerts.innerHTML += planCheck.errors.map(e => `<div class="alert alert-error">${e}</div>`).join('');
          return;
        }

        document.getElementById('preview').innerHTML = AnnualPlanEngine.renderAnnualPlanHTML(currentPlan);
        document.getElementById('previewPanel').style.display = 'block';
        document.getElementById('btnPrint').disabled = false;
        document.getElementById('btnDownload').disabled = false;

        MiniBilgeStorage.addPlan({
          tur: 'yillik',
          sinif: currentPlan.sinif,
          ders: currentPlan.ders,
          dersId: currentPlan.dersId,
          data: currentPlan
        });

        alerts.innerHTML += `<div class="alert alert-ok">✅ ${currentPlan.toplamHafta} haftalık yıllık plan oluşturuldu (${currentPlan.ders}).</div>`;
      } catch (err) {
        alerts.innerHTML = `<div class="alert alert-error">Hata: ${err.message}</div>`;
      }
    });

    document.getElementById('btnPrint').addEventListener('click', () => {
      const w = window.open('', '_blank');
      w.document.write('<html><head><title>Yıllık Plan</title><link rel="stylesheet" href="../assets/css/belgeler.css"></head><body class="preview-content">' + document.getElementById('preview').innerHTML + '</body></html>');
      w.document.close();
      setTimeout(() => w.print(), 400);
    });

    document.getElementById('btnDownload').addEventListener('click', () => {
      if (!currentPlan) return;
      const html = '<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><title>Yıllık Plan</title></head><body>' + document.getElementById('preview').innerHTML + '</body></html>';
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
      a.download = `yillik-plan-${currentPlan.dersId}-sinif${currentPlan.sinif}.html`;
      a.click();
      MiniBilgeStorage.addDocument({ title: `Yıllık Plan — ${currentPlan.ders}`, type: 'yillik' });
    });
  })();
  </script>
</body>
</html>
