<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yıllık Planlar — MiniBilge Öğretmen</title>
  <link rel="stylesheet" href="../assets/css/platform.css">
  <link rel="stylesheet" href="../assets/css/belgeler.css">
  <link rel="stylesheet" href="../assets/css/ds.css">
  <script src="../assets/js/components/a11y.js"></script>
</head>
<body>
  <div id="app"></div>
  <script>window.MINIBILGE_BASE = '../';</script>
  <script src="../assets/js/core/storage.js"></script>
  <script src="../assets/js/core/offline-sync.js"></script>
  <script src="../assets/js/core/calendar-engine.js"></script>
  <script src="../assets/js/core/tpm-engine.js"></script>
  <script src="../assets/js/core/curriculum-engine.js"></script>
  <script src="../assets/js/core/annual-plan-engine.js"></script>
  <script src="../assets/js/core/daily-plan-engine.js"></script>
  <script src="../assets/js/core/validation-engine.js"></script>
  <script src="../assets/js/core/plan-engine.js"></script>
  <script src="../assets/js/core/evrak-engine.js"></script>
  <script src="../assets/js/core/wizard.js"></script>
  <script src="../assets/js/components/mb-components.js"></script>
  <script src="../assets/js/components/notify.js"></script>
  <script src="../assets/js/components/interaction.js"></script>
  <script src="../assets/js/components/txs.js"></script>
  <script src="../assets/js/components/txa.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script>
  (async function () {
    const profile = MiniBilgeStorage.getProfile();
    const school = MiniBilgeStorage.getSchool();
    const settings = MiniBilgeStorage.getSettings();
    const grades = await CurriculumEngine.listAvailableGrades();
    let step = 1;
    let currentPlan = null;
    let cal = null;
    const state = {
      sinif: settings.varsayilanSinif || '1',
      dersId: settings.varsayilanDers || 'turkce',
      kaynakId: settings.varsayilanKaynakId || null,
      sube: settings.sube || 'A'
    };
    let courseList = [];
    let sourceList = [];

    async function loadCourses() {
      courseList = await CurriculumEngine.listAvailableCourses(state.sinif, { onlyProgram: true });
      if (!courseList.find(c => c.id === state.dersId)) state.dersId = courseList[0]?.id || 'turkce';
      await loadSources();
    }

    async function loadSources() {
      sourceList = await CurriculumEngine.listSourcesForDers(state.dersId, state.sinif);
      if (!sourceList.find(s => s.id === state.kaynakId)) {
        state.kaynakId = (sourceList.find(s => s.durum === 'ACTIVE') || sourceList[0] || {}).id || null;
      }
    }

    async function loadCal(yil) {
      try {
        CalendarEngine.setYear(yil || school.egitimYili || '2025-2026');
        cal = await CalendarEngine.loadCalendar();
      } catch (e) {
        cal = null;
      }
    }

    await loadCourses();
    await loadCal();

    function render() {
      const weeks = cal ? CalendarEngine.getTeachingWeeks(cal) : [];
      const tatilCount = cal?.tatiller?.length || 0;
      const gunCount = cal?.belirliGunler?.length || 0;
      const Txa = window.MiniBilgeTxa;
      const purposeHtml = Txa ? Txa.declarePurpose({
        id: 'yillik-plan',
        purpose: 'Yıllık plan oluştur · önizle · düzenle · belge üret',
        steps: ['Oluştur', 'Önizle', 'Düzenle', 'Belge üret']
      }).html : '';
      const quickHtml = Txa ? Txa.QuickActions([
        { label: 'Öğretim Programı', href: 'ogretim-programi.html' },
        { label: 'Günlük Plan', href: 'gunluk-plan.html' },
        { label: 'AI Asistan', href: 'ai.html?q=' + encodeURIComponent('Yıllık plan oluştur') }
      ]).html : '';
      const primaryHtml = Txa ? Txa.PrimaryActions([
        step < 4
          ? { id: 'next', label: step === 3 ? 'Üretime geç' : 'İleri', dominant: true }
          : { id: 'generate', label: 'Yıllık Planı Üret', dominant: true },
        { id: 'preview', label: 'Önizle' },
        { id: 'ai', label: 'AI Kontrol', href: 'ai.html?q=' + encodeURIComponent('Yıllık planı kontrol et') },
        { id: 'extra', label: 'Hesabım', href: 'hesabim.html' }
      ], {
        onAction(id) {
          if (id === 'next') document.getElementById('btnNext')?.click();
          if (id === 'generate') document.getElementById('btnGenerate')?.click();
          if (id === 'preview') {
            const panel = document.getElementById('previewPanel');
            if (panel) panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        }
      }).html : '';

      const content = `
      <div class="dash plan-layout">
        <div class="plan-main">
          <header class="dash-hero">
            <p class="brand-kicker">Yıllık Planlar · TXA</p>
            <h1>TYMM uyumlu yıllık plan</h1>
            <p class="dash-date">TXA-001 tek amaç · Program ≠ Plan ≠ Belge</p>
          </header>

          ${purposeHtml}
          ${quickHtml}
          ${UretimWizard.render(step)}
          <div id="alerts"></div>

          <section class="mb-section" id="yillik-form">
            <h2>${stepTitle()}</h2>
            <p class="section-lead">${stepLead()}</p>
            ${step === 1 ? stepSinif() : ''}
            ${step === 2 ? stepDers() : ''}
            ${step === 3 ? stepBilgiler() : ''}
            ${step === 4 ? stepUret(weeks, tatilCount, gunCount) : ''}
          </section>

          ${primaryHtml}
          <div class="quick-actions no-print" style="display:none">
            ${step > 1 ? '<button class="quick-btn" id="btnPrev" type="button">Geri</button>' : ''}
            ${step < 4 ? '<button class="quick-btn primary" id="btnNext" type="button">İleri</button>' : ''}
          </div>
          ${step > 1 ? '<button class="quick-btn compact no-print" id="btnPrev" type="button" style="margin-bottom:12px">Geri</button>' : ''}

          <div id="txa-doc-host"></div>
          <div id="txa-versions-host"></div>

          <div id="previewPanel" style="display:none">
            <section class="mb-section">
              <h2>Üretilen plan</h2>
              <p class="section-lead">Önizleme · Word / PDF / Yazdır / AI Kontrol (TXA-007)</p>
              <div class="plan-preview" id="preview"></div>
            </section>
          </div>
        </div>

        <aside class="plan-aside no-print">
          <h3>AI önerileri · TXA-003</h3>
          <p class="hint">Bu ekranın bağlamını bilir; hazır plan kopyalamaz.</p>
          <button type="button" class="ai-chip" data-ai="uret">Bu bağlamla yıllık planı üret</button>
          <button type="button" class="ai-chip" data-ai="takvim">Takvim çakışmalarını kontrol et</button>
          <button type="button" class="ai-chip" data-ai="otp">OTP / pekiştirme haftalarını ayır</button>
          <a class="text-link" href="ai.html" style="display:inline-block;margin-top:10px">MiniBilge AI’ya git</a>
        </aside>
      </div>`;
      document.getElementById('app').innerHTML = MiniBilgeNav.renderLayout('yillik-plan', content);
      bindEvents();
      if (Txa) {
        Txa.fillFromContext('#yillik-form', {
          okul: school.okulAdi,
          il: school.il,
          ilce: school.ilce,
          ogretmen: profile.adSoyad,
          sinif: state.sinif,
          sube: state.sube
        });
        Txa.autosave({
          root: '#yillik-form',
          key: 'txa-yillik-plan',
          notify: false,
          save() { /* draft in session via Interaction */ }
        });
        Txa.VersionHistory.render('yillik-plan').mount('#txa-versions-host');
        if (currentPlan) mountDocActions();
      }
    }

    function mountDocActions() {
      const host = document.getElementById('txa-doc-host');
      if (!host || !window.MiniBilgeTxa || !currentPlan) return;
      MiniBilgeTxa.DocumentActions({
        onPreview() {
          document.getElementById('previewPanel').style.display = 'block';
          document.getElementById('previewPanel').scrollIntoView({ behavior: 'smooth' });
        },
        onWord() {
          EvrakEngine.indirWord(PlanEngine.renderYillikPlan(currentPlan), 'yillik-plan', 'Yıllık Plan');
        },
        onPdf() {
          EvrakEngine.yazdir(PlanEngine.renderYillikPlan(currentPlan), 'Yıllık Plan');
        },
        onPrint() {
          EvrakEngine.yazdir(PlanEngine.renderYillikPlan(currentPlan), 'Yıllık Plan');
        },
        onAiCheck() {
          location.href = 'ai.html?q=' + encodeURIComponent('Yıllık planı kontrol et');
        }
      }).mount(host);
    }

    function stepTitle() {
      return ['Sınıf seçimi', 'Ders seçimi', 'Okul ve öğretmen bilgileri', 'Üretim'][step - 1];
    }
    function stepLead() {
      return [
        'Hangi sınıf için yıllık plan üreteceksiniz?',
        'Ders, öğretim programı motorundan (MB-TPM) gelir.',
        'Bu bilgiler belgenin üst bilgisine yazılır.',
        'Takvim otomatik bağlanır; ardından plan üretilir.'
      ][step - 1];
    }

    function stepSinif() {
      return `<div class="ctx-grid">
        <div class="form-field"><label>Sınıf</label>
          <select id="sinif">${['1','2','3','4'].map(g => {
            const avail = grades.includes(g);
            return `<option value="${g}" ${state.sinif === g ? 'selected' : ''} ${avail ? '' : 'disabled'}>${g}. Sınıf${avail ? '' : ' (yakında)'}</option>`;
          }).join('')}</select>
        </div>
        <div class="form-field"><label>Şube</label>
          <input id="sube" value="${state.sube}" maxlength="2">
        </div>
      </div>`;
    }

    function stepDers() {
      const src = sourceList.find(s => s.id === state.kaynakId) || sourceList[0];
      const multi = sourceList.length > 1;
      return `<div class="ctx-grid">
        <div class="form-field"><label>Ders (${state.sinif}. Sınıf)</label>
          <select id="ders">${courseList.map(c =>
            `<option value="${c.id}" ${state.dersId === c.id ? 'selected' : ''}>${c.ad}${c.sourceCount > 1 ? ' · ' + c.sourceCount + ' kaynak' : ''}</option>`).join('')}
          </select>
        </div>
        <div class="form-field form-field--wide">
          <label>MEB / TYMM kaynağı ${multi ? '(' + sourceList.length + ' seçenek)' : ''}</label>
          <select id="kaynak">${sourceList.map(s =>
            `<option value="${s.id}" ${state.kaynakId === s.id ? 'selected' : ''}>${s.shortLabel || s.ad} · ${s.durum}</option>`).join('')}
          </select>
          <p class="field-hint">Aynı ders için Milli Eğitim’in farklı program kaynakları olabilir. Önce dersi, sonra kaynağı seçin; ardından plan motoru çalışır.</p>
        </div>
      </div>
      ${src ? `<div class="mb-source-card" data-kaynak="${src.id}">
        <strong>${src.ad}</strong>
        <div class="mb-source-meta">
          <span>${src.model || 'TYMM'}</span>
          <span>Onay ${src.onayYili || '—'}</span>
          <span class="mb-lib-badge mb-lib-badge--${src.durum === 'ACTIVE' ? 'hi' : 'low'}">${src.durum}</span>
        </div>
        ${src.kaynakUrl ? `<a class="text-link" href="${src.kaynakUrl}" target="_blank" rel="noopener">Resmî programı aç (MEB)</a>` : ''}
        ${src.not ? `<p class="section-lead">${src.not}</p>` : ''}
      </div>` : ''}`;
    }

    function stepBilgiler() {
      return `<div class="ctx-grid">
        <div class="form-field"><label>Okul</label><input id="okulAdi" name="okul" data-txa-field="okul" value="${school.okulAdi || ''}"></div>
        <div class="form-field"><label>İl</label><input id="il" name="il" data-txa-field="il" value="${school.il || ''}"></div>
        <div class="form-field"><label>İlçe</label><input id="ilce" name="ilce" data-txa-field="ilce" value="${school.ilce || ''}"></div>
        <div class="form-field"><label>Öğretmen</label><input id="ogretmenAdi" name="ogretmen" data-txa-field="ogretmen" value="${profile.adSoyad || ''}"></div>
        <div class="form-field"><label>Sınıf</label><input value="${state.sinif}" disabled></div>
        <div class="form-field"><label>Şube</label><input id="sube2" name="sube" data-txa-field="sube" value="${state.sube}"></div>
        <div class="form-field"><label>Yıl</label>
          <select id="egitimYili" name="egitimYili" data-txa-field="egitimYili">
            <option value="2025-2026" ${school.egitimYili !== '2026-2027' ? 'selected' : ''}>2025-2026</option>
            <option value="2026-2027" ${school.egitimYili === '2026-2027' ? 'selected' : ''}>2026-2027</option>
          </select>
        </div>
      </div>
      <p class="empty-state" style="text-align:left;margin-top:10px">TXA-002 — kayıtlı bilgiler otomatik dolar. Kalıcı için <a class="text-link" href="hesabim.html">Hesabım</a>.</p>`;
    }

    function stepUret(weeks, tatilCount, gunCount) {
      const dersAd = courseList.find(c => c.id === state.dersId)?.ad || state.dersId;
      const src = sourceList.find(s => s.id === state.kaynakId);
      return `
        <div class="cal-strip" style="margin-bottom:16px">
          <div class="cal-pill"><strong>Öğretim haftası</strong><span>${weeks.length || '—'}</span></div>
          <div class="cal-pill"><strong>Tatil kaydı</strong><span>${tatilCount}</span></div>
          <div class="cal-pill"><strong>Belirli gün</strong><span>${gunCount}</span></div>
          <div class="cal-pill"><strong>Bağlam</strong><span>${state.sinif}/${state.sube} · ${dersAd}</span></div>
          <div class="cal-pill"><strong>Kaynak</strong><span>${src ? (src.shortLabel || src.ad) : '—'}</span></div>
        </div>
        <div class="quick-actions">
          <button class="quick-btn primary txa-dominant" id="btnGenerate" type="button">Yıllık Planı Üret</button>
        </div>`;
    }

    function collectCtx() {
      const yil = document.getElementById('egitimYili')?.value || school.egitimYili || '2025-2026';
      state.sube = document.getElementById('sube2')?.value || document.getElementById('sube')?.value || state.sube;
      return {
        sinif: state.sinif,
        dersId: state.dersId,
        kaynakId: state.kaynakId,
        sube: state.sube,
        okul: {
          okulAdi: document.getElementById('okulAdi')?.value || school.okulAdi,
          il: document.getElementById('il')?.value || school.il,
          ilce: document.getElementById('ilce')?.value || school.ilce,
          egitimYili: yil
        },
        ogretmen: { adSoyad: document.getElementById('ogretmenAdi')?.value || profile.adSoyad }
      };
    }

    async function generate() {
      const alerts = document.getElementById('alerts');
      const ctx = collectCtx();
      await loadCal(ctx.okul.egitimYili);
      const result = await PlanEngine.uretYillikPlan(ctx);
      if (!result.success) {
        alerts.innerHTML = result.errors.map(e => `<div class="alert alert-error">${e}</div>`).join('');
        return;
      }
      currentPlan = result.plan;
      currentPlan.sube = ctx.sube;
      document.getElementById('preview').innerHTML = PlanEngine.renderYillikPlan(currentPlan);
      document.getElementById('previewPanel').style.display = 'block';
      MiniBilgeStorage.addPlan({
        tur: 'yillik', sinif: currentPlan.sinif, ders: currentPlan.ders,
        dersId: currentPlan.dersId, kaynakId: currentPlan.kaynakId, sube: ctx.sube, data: currentPlan
      });
      MiniBilgeStorage.saveSettings({
        varsayilanSinif: state.sinif,
        varsayilanDers: state.dersId,
        varsayilanKaynakId: state.kaynakId,
        sube: state.sube
      });
      if (window.MiniBilgeTxa) {
        MiniBilgeTxa.VersionHistory.push('yillik-plan', currentPlan, {
          label: currentPlan.sinif + '/' + ctx.sube + ' · ' + (currentPlan.ders || currentPlan.dersId) +
            (currentPlan.kaynakShort ? ' · ' + currentPlan.kaynakShort : '')
        });
        mountDocActions();
        MiniBilgeTxa.VersionHistory.render('yillik-plan').mount('#txa-versions-host');
      }
      alerts.innerHTML = `<div class="alert alert-ok">${currentPlan.toplamHafta} haftalık yıllık plan üretildi · kaynak: ${currentPlan.kaynakShort || currentPlan.kaynak || '—'} · TXA-008 sürüm kaydedildi.</div>`;
    }

    function bindEvents() {
      document.getElementById('btnNext')?.addEventListener('click', async () => {
        if (step === 1) {
          state.sinif = document.getElementById('sinif')?.value || state.sinif;
          state.sube = document.getElementById('sube')?.value || state.sube;
          await loadCourses();
        }
        if (step === 2) {
          state.dersId = document.getElementById('ders')?.value || state.dersId;
          state.kaynakId = document.getElementById('kaynak')?.value || state.kaynakId;
        }
        if (step === 3) {
          const yil = document.getElementById('egitimYili')?.value;
          await loadCal(yil);
        }
        if (step < 4) { step++; render(); }
      });
      document.getElementById('btnPrev')?.addEventListener('click', () => { if (step > 1) { step--; render(); } });
      document.getElementById('btnGenerate')?.addEventListener('click', generate);
      document.getElementById('ders')?.addEventListener('change', async (e) => {
        state.dersId = e.target.value;
        await loadSources();
        render();
      });
      document.getElementById('kaynak')?.addEventListener('change', (e) => {
        state.kaynakId = e.target.value;
        render();
      });
      document.querySelectorAll('[data-ai]').forEach(btn => {
        btn.addEventListener('click', () => {
          const k = btn.getAttribute('data-ai');
          if (k === 'uret') {
            if (step !== 4) { step = 4; render(); setTimeout(generate, 50); }
            else generate();
          } else if (k === 'takvim') {
            location.href = 'takvim.html';
          } else {
            const alerts = document.getElementById('alerts');
            alerts.innerHTML = '<div class="alert alert-warn">OTP / pekiştirme haftaları plan motorunda MB-ALG-001 ile ayrılacak.</div>';
          }
        });
      });
    }

    render();
  })();
  </script>
</body>
</html>
