<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABC Bağlamaca – PDF Görsel Tablolar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #d8d4cc;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    h1 { font-size: 1.1rem; color: #222; }
    .note { font-size: 0.9rem; color: #444; text-align: center; max-width: 520px; line-height: 1.4; }

    /* PDF sayfa kopyası */
    .page {
      width: min(100%, 560px);
      background: #fff;
      border: 2px solid #111;
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    }
    .bar {
      background: #2b2b2b;
      color: #fff;
      text-align: center;
      padding: 10px;
      font-family: 'Times New Roman', Times, serif;
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      font-weight: 700;
    }
    .bar.footer {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      letter-spacing: 0.04em;
      color: rgba(255,255,255,0.8);
      font-family: sans-serif;
      font-weight: 400;
    }
    .puzzles {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px 24px;
      padding: 28px 22px;
    }
    .puzzle-wrap { text-align: center; }
    .puzzle-label {
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: #333;
    }
    .puzzle {
      border: 2px solid #111;
      display: inline-block;
      padding: 14px;
      background: #fff;
    }
    .grid {
      display: grid;
      gap: 0;
    }
    .cell {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Times New Roman', Times, serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: #111;
      position: relative;
    }
    .cell.dot::after {
      content: '';
      width: 5px;
      height: 5px;
      background: #111;
      border-radius: 50%;
    }

    @media (max-width: 520px) {
      .puzzles { grid-template-columns: 1fr; }
      .cell { width: 36px; height: 36px; font-size: 1.3rem; }
    }
  </style>
</head>
<body>
  <h1>PDF Referans – Görsel Tablolar</h1>
  <p class="note">Aşağıdaki 4 bulmaca, yüklediğiniz PDF’den birebir çıkarıldı. Konumlar doğruysa bir sonraki adımda oyun kodunu buna göre yazarım.</p>

  <div class="page">
    <div class="bar">ZEKA OYUNLARI – ABC BAĞLAMACA</div>
    <div class="puzzles" id="puzzles"></div>
    <div class="bar footer">
      <span>www.matematiksorubankasi.com</span>
      <span>2012</span>
    </div>
  </div>

  <script>
    const PUZZLES = [
      {
        label: 'Bulmaca 1 — Sol Üst (A–D)',
        size: 6,
        endpoints: {
          A: [[4,0],[4,3]],
          B: [[2,3],[3,5]],
          C: [[1,4],[2,2]],
          D: [[1,1],[5,0]]
        }
      },
      {
        label: 'Bulmaca 2 — Sağ Üst (A–D)',
        size: 6,
        endpoints: {
          D: [[0,0],[5,1]],
          A: [[3,2],[5,5]],
          B: [[2,3],[5,2]],
          C: [[3,3],[0,5]]
        }
      },
      {
        label: 'Bulmaca 3 — Sol Alt (A–E)',
        size: 6,
        endpoints: {
          D: [[0,0],[4,4]],
          C: [[0,1],[1,3]],
          B: [[0,2],[2,1]],
          A: [[0,5],[2,5]],
          E: [[4,1],[5,3]]
        }
      },
      {
        label: 'Bulmaca 4 — Sağ Alt (A–E)',
        size: 6,
        endpoints: {
          A: [[0,4],[1,0]],
          B: [[0,5],[4,2]],
          D: [[1,1],[5,5]],
          C: [[2,2],[5,0]],
          E: [[2,5],[4,5]]
        }
      }
    ];

    const root = document.getElementById('puzzles');
    PUZZLES.forEach((p, i) => {
      const wrap = document.createElement('div');
      wrap.className = 'puzzle-wrap';

      const label = document.createElement('div');
      label.className = 'puzzle-label';
      label.textContent = p.label;
      wrap.appendChild(label);

      const frame = document.createElement('div');
      frame.className = 'puzzle';

      const grid = document.createElement('div');
      grid.className = 'grid';
      grid.style.gridTemplateColumns = `repeat(${p.size}, 1fr)`;

      const map = {};
      Object.entries(p.endpoints).forEach(([L, coords]) => {
        coords.forEach(([r,c]) => { map[r + ',' + c] = L; });
      });

      for (let r = 0; r < p.size; r++) {
        for (let c = 0; c < p.size; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          const L = map[r + ',' + c];
          if (L) cell.textContent = L;
          else cell.classList.add('dot');
          grid.appendChild(cell);
        }
      }

      frame.appendChild(grid);
      wrap.appendChild(frame);
      root.appendChild(wrap);
    });
  </script>
</body>
</html>
